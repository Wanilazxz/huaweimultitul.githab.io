<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Huawei Storage · Моё хранилище</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:#08090d;color:#e8ecf3;overflow-x:hidden;line-height:1.6}

.bg-canvas{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 20%,rgba(124,58,237,.15) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(59,130,246,.12) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(236,72,153,.06) 0%,transparent 60%),#08090d}
.bg-orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 20s ease-in-out infinite}
.orb.o1{width:400px;height:400px;background:#7c3aed;top:-100px;left:-100px}
.orb.o2{width:350px;height:350px;background:#3b82f6;bottom:-100px;right:-80px;animation-delay:-7s}
.orb.o3{width:280px;height:280px;background:#ec4899;top:40%;left:60%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.95)}}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,9,13,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.nav-logo::before{content:'';width:10px;height:10px;background:linear-gradient(135deg,#a78bfa,#60a5fa);border-radius:50%;box-shadow:0 0 12px #a78bfa;animation:pulseDot 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}
.nav-search input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;color:#e8ecf3;width:240px;outline:none;font-size:13px;font-family:inherit;transition:all .2s}
.nav-search input::placeholder{color:#64748b}
.nav-search input:focus{border-color:rgba(167,139,250,.5);box-shadow:0 0 0 3px rgba(167,139,250,.15)}

.hero{padding:120px 0 50px;text-align:center;min-height:auto;display:flex;flex-direction:column;justify-content:center}
.hero-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;animation:slideDown .8s ease}
.badge-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:#c4b5fd;padding:6px 14px;border-radius:50px;font-size:12px;font-weight:600}
.badge-chip .dot{width:6px;height:6px;background:#4ade80;border-radius:50%;box-shadow:0 0 8px #4ade80;animation:pulseDot 1.5s ease-in-out infinite}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,6vw,56px);font-weight:700;line-height:1.08;letter-spacing:-1px;margin-bottom:16px;animation:slideDown .8s ease .1s backwards}
.hero h1 .gradient{background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#f472b6 100%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientShift 4s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero p{font-size:clamp(14px,2vw,17px);color:#94a3b8;max-width:560px;margin:0 auto 0;animation:slideDown .8s ease .2s backwards}

.section{padding:30px 0 60px}
.container{max-width:1120px;margin:0 auto;padding:0 20px}

.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:34px 0 26px}
.cat-btn{font-family:'Inter',sans-serif;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:9px 18px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s}
.cat-btn:hover{color:#fff;border-color:rgba(167,139,250,.5);transform:translateY(-2px)}
.cat-btn.active{background:linear-gradient(135deg,#7c3aed,#3b82f6);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.35)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px;transition:all .35s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-6px);border-color:rgba(167,139,250,.35);box-shadow:0 20px 50px rgba(124,58,237,.2)}
.card-head{display:flex;align-items:center;gap:12px}
.card-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:transform .35s}
.card:hover .card-ico{transform:scale(1.1) rotate(-5deg)}
.ico-purple{background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(124,58,237,.15))}
.ico-blue{background:linear-gradient(135deg,rgba(96,165,250,.25),rgba(59,130,246,.15))}
.ico-pink{background:linear-gradient(135deg,rgba(244,114,182,.25),rgba(236,72,153,.15))}
.ico-green{background:linear-gradient(135deg,rgba(74,222,128,.25),rgba(34,197,94,.15))}
.ico-gold{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(245,158,11,.15))}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.card .desc{font-size:13px;color:#94a3b8;flex-grow:1}
.card .tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;font-weight:600;padding:4px 10px;border-radius:50px;background:rgba(255,255,255,.06);color:#cbd5e1;border:1px solid rgba(255,255,255,.08)}
.tag.size{color:#a78bfa;background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.25)}
.tag.soon{color:#fbbf24;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;transition:all .25s;cursor:pointer;border:none;font-family:inherit;margin-top:2px}
.btn-dl{background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.35)}
.btn-dl:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(124,58,237,.5)}
.btn-soon{background:rgba(255,255,255,.05);color:#64748b;border:1px solid rgba(255,255,255,.1);cursor:default}
.btn-soon:hover{transform:none}

.empty{text-align:center;color:#64748b;padding:60px 0;font-size:14px}
.empty .big{font-size:44px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(167,139,250,.5))}

.footer{text-align:center;padding:36px 20px 25px;color:#475569;font-size:13px;border-top:1px solid rgba(255,255,255,.05)}
.footer .glow{color:#a78bfa}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ===== ВХОД ПО ПАРОЛЮ ===== */
.lock-screen{position:fixed;inset:0;z-index:500;background:rgba(8,9,13,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .5s}
.lock-screen.hidden{opacity:0;pointer-events:none}
.lock-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:36px 30px;text-align:center;max-width:340px;width:100%;animation:popIn .5s ease}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.lock-ico{font-size:44px;margin-bottom:14px;filter:drop-shadow(0 0 20px rgba(167,139,250,.6));animation:bounce 2.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.08)}}
.lock-card h2{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px}
.lock-card p{color:#94a3b8;font-size:13px;margin-bottom:20px}
.lock-input{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 16px;color:#e8ecf3;font-size:16px;text-align:center;letter-spacing:4px;outline:none;font-family:inherit;margin-bottom:12px;transition:all .2s}
.lock-input:focus{border-color:rgba(167,139,250,.6);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.lock-input.err{border-color:rgba(248,113,113,.6);box-shadow:0 0 0 3px rgba(248,113,113,.15);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-btn{width:100%;background:linear-gradient(135deg,#7c3aed,#3b82f6);border:none;color:#fff;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .25s;box-shadow:0 8px 24px rgba(124,58,237,.35)}
.lock-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,58,237,.5)}
.lock-err{color:#f87171;font-size:12px;height:18px;margin-bottom:6px;font-weight:600}

@media(max-width:768px){
  .nav{padding:12px 16px;flex-direction:column;gap:10px}
  .nav-search input{width:100%}
  .hero{padding:110px 0 30px}
  .section{padding:20px 0 40px}
}
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<!-- ===== ЭКРАН ВХОДА ===== -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-ico">🔐</div>
    <h2>Личное хранилище</h2>
    <p>Введите пароль, чтобы войти</p>
    <input type="password" class="lock-input" id="lockInput" placeholder="••••">
    <div class="lock-err" id="lockErr"></div>
    <button class="lock-btn" id="lockBtn">Войти</button>
  </div>
</div>

<nav class="nav" id="nav">
  <div class="nav-logo">Huawei Storage</div>
  <div class="nav-search">
    <input type="text" id="search" placeholder="Поиск по файлам...">
  </div>
</nav>

<section class="hero">
  <div class="container">
    <div class="hero-badges">
      <span class="badge-chip">💾 Твоё хранилище</span>
    </div>
    <h1>Моё <span class="gradient">хранилище</span><br>файлов и программ</h1>
    <p>Все нужные программы в одном месте — скачивай с любого устройства</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="big">📦</div>
      Пока пусто — добавь первую программу или сборку
    </div>
  </div>
</section>

<footer class="footer">
  <p>Huawei <span class="glow">Storage</span> · личное хранилище · сделано с душой</p>
</footer>

<script>
var PASSWORD = "1234";
function ic(color){return color==='blue'?'ico-blue':color==='pink'?'ico-pink':color==='green'?'ico-green':color==='gold'?'ico-gold':'ico-purple'}

var APPS = [];

var CATS = ["Все", ...new Set(APPS.map(a => a.cat))];
var catsEl = document.getElementById('cats');
CATS.forEach(c => {
  var b = document.createElement('button');
  b.className = 'cat-btn' + (c === 'Все' ? ' active' : '');
  b.textContent = c;
  b.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  catsEl.appendChild(b);
});

var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var search = document.getElementById('search');

function render() {
  var q = (search.value||'').toLowerCase();
  var activeCat = document.querySelector('.cat-btn.active').textContent;
  var list = APPS.filter(a =>
    (activeCat === 'Все' || a.cat === activeCat) &&
    (a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q))
  );
  grid.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';
  list.forEach((a, i) => {
    var card = document.createElement('div');
    card.className = 'card reveal';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-ico ${ic(a.color)}">${a.icon}</div>
        <h3>${a.name}</h3>
      </div>
      <div class="desc">${a.desc}</div>
      <div class="tags">
        <span class="tag size">${a.size || '—'}</span>
        ${a.tag ? `<span class="tag ${a.tag === 'Скоро' ? 'soon' : ''}">${a.tag}</span>` : ''}
      </div>
      ${a.link && a.link !== '#' ? `<a class="btn btn-dl" href="${a.link}" target="_blank" rel="noopener">⬇ Скачать</a>` : '<span class="btn btn-soon">Скоро</span>'}
    `;
    grid.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
  });
}

search.addEventListener('input', render);
render();

// ===== ПАРОЛЬ =====
var lockScreen = document.getElementById('lockScreen');
var lockInput = document.getElementById('lockInput');
var lockErr = document.getElementById('lockErr');
var nav = document.getElementById('nav');

document.getElementById('lockBtn').addEventListener('click', tryUnlock);
lockInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });

function tryUnlock() {
  if (lockInput.value === PASSWORD) {
    lockScreen.classList.add('hidden');
    nav.style.display = 'flex';
    lockErr.textContent = '';
  } else {
    lockErr.textContent = 'Неверный пароль';
    lockInput.classList.add('err');
    lockInput.value = '';
    setTimeout(() => lockInput.classList.remove('err'), 450);
  }
}
</script>
</body>
</html>
